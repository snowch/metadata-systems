name: Format startup candidate
on:
  push:
    branches: [codex/python-loading-progress]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write .
      - name: Formatting patch
        run: git diff --binary | base64 -w 0
