# Copyright © 2026 Christopher Snow

name: Deploy the course to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it is off. It cannot switch an existing site from "Deploy from a
          # branch" to "GitHub Actions": that is Settings -> Pages -> Source, by hand.
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build under the base path Pages serves from
        # A project site lives at /metadata-systems/. The same origin, snowch.github.io, serves the
        # author's other courses, so every URL is relative to this base and every storage key is
        # prefixed with the book's id, ms.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build -w @ms/course

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/course/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # No `environment:` key, as in the digital-design course: an environment rule naming the
    # branch that was the default when Pages was first enabled refused later deploys from main.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
