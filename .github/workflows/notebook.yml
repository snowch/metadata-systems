# Chapter 1 as Jupyter notebooks, one per part of the chapter, in JupyterLite: a prototype beside
# the course. On every branch it checks the engine's facts and the notebooks' words, builds the
# site with Pyodide and every package inside it, so a page fetches nothing from a third party, and
# keeps the result as an artifact to read before anything is merged. On main, deploy.yml builds the
# same site into the published course under /jupyterlite/.

name: Notebook prototype

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jupyterlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The engine's facts and the chapter's words
        run: python -m unittest discover -s notebook/tests -t notebook -v

      - name: Install JupyterLite, its Pyodide kernel and the widgets
        run: pip install -r notebook/jupyterlite/requirements.txt

      - name: Build the chapter as a JupyterLite site
        run: notebook/jupyterlite/build.sh jupyterlite-site

      - name: List what the page bundles
        run: |
          find jupyterlite-site -type f -printf '%s %P\n' | sort -k2
          du -sb jupyterlite-site

      - uses: actions/upload-artifact@v4
        with:
          name: jupyterlite-site
          path: jupyterlite-site
          retention-days: 14
